# 設定版本：1.6.1
# 升級至最新版本時，請先閱讀更新紀錄，確認是否有重大設定變更。
#
# 此設定預設使用 Minecraft 原版釣魚流程，成功釣到物品時會改為給予 KKFish 自訂魚類。
# 若同時安裝其他會修改釣魚機制的插件，可能會發生功能衝突。

# ======================================================================
# 插件基本設定
# ======================================================================

# bStats 匿名使用統計
bstats:
  # 是否啟用 bStats 資料收集
  enabled: true

# 語言設定
language:
  # 目前插件原生支援 zh_cn 與 en_us。
  # 本繁體中文設定包沿用 zh_cn 代碼，以確保語言檔可正常載入。
  current: "zh_cn"

# 時區設定，用於定時比賽等功能
timezone:
  # 台灣時區；留空則使用伺服器系統時區
  value: "Asia/Taipei"

# 更新檢查
update-check:
  # 是否自動檢查插件更新
  enabled: true

# 除錯模式
debug:
  # 啟用後會在控制台及遊戲內顯示詳細除錯資訊
  enabled: false

# 視覺效果
visual-effects:
  # 是否啟用粒子及動畫效果
  enabled: true

  # 魚類上鉤動畫
  fish-animation:
    enabled: true
    # 動畫最長持續刻數
    max-ticks: 40
    # 魚跳出水面的最高高度
    peak-height: 2.5
    # 魚類動畫最大移動速度
    max-speed: 0.5
    # 向上移動力度係數
    upward-force-factor: 0.25
    # 到達最高點的進度比例
    peak-progress: 0.25
    # 最低 Y 軸位移
    min-y-offset: 0.8

    # 魚跳向玩家的動畫設定
    jump-to-head:
      # 基礎持續時間，單位為刻
      base-duration: 20
      # 距離倍率
      distance-multiplier: 5.0
      # 最長持續時間，單位為刻
      max-duration: 60
      # 初始跳躍高度
      initial-jump-height: 2.0
      # 拋物線曲線高度
      curve-height: 3.0
      # 動畫緩動係數
      easing-factor: 2.0

# ======================================================================
# 世界與釣魚模式
# ======================================================================

# 世界白名單
world-whitelist:
  # true：只在白名單世界啟用；false：在所有世界啟用
  enabled: true
  worlds:
    - "spawn"
    - "world"
    - "world_nether"
    - "world_the_end"

# 釣魚模式設定
mode-switch:
  # 玩家沒有個別模式覆寫時使用的預設模式
  # 可用值：plugin（KKFish 小遊戲）／vanilla（原版釣魚流程）
  default-mode: vanilla

  # 是否允許玩家使用 /kf toggle 切換模式
  allow-command-switch: true

  vanilla-mode:
    # 原版模式成功釣到物品時，是否取消原版魚獲並給予 KKFish 自訂魚類
    give-custom-fish: true

# ======================================================================
# 核心釣魚設定
# ======================================================================

fishing-settings:
  # KKFish 小遊戲模式的最大蓄力時間，單位為毫秒
  max-charge-time: 3000

  # 拋竿冷卻時間，單位為毫秒
  cast-cooldown: 5000

  # 基礎上鉤機率，範圍為 0.0 至 1.0
  base-bite-chance: 0.2

  # 最大上鉤機率，範圍為 0.0 至 1.0
  max-bite-chance: 1.0

  # 上鉤檢查最短及最長延遲，單位為毫秒
  bite-check-delay-min: 5000
  bite-check-delay-max: 15000

  # 上鉤提示有效時間，單位為秒
  bite-hint-timeout: 2

  # 魚類逃脫機制
  # false：進入上鉤階段後不再以 bite-chance 判定逃脫
  # true：保留機率判定及逾時逃脫機制
  escape: false

  # 小遊戲初始進度，範圍為 0 至 100
  initial-progress: 10

  progress-bar:
    # 按住控制鍵時，綠色區域上升速度
    increase-speed: 0.015
    # 放開控制鍵時，綠色區域下降速度
    decrease-speed: 0.01

    rarity-impact:
      # 是否讓稀有度影響小遊戲難度
      enabled: true
      # 每個稀有度等級造成的減速幅度
      slowdown-per-rarity-level: 0.15
      # 最低上升速度比例
      min-increase-speed-ratio: 0.45

  # 稀有度系統；權重越高，該稀有度越容易出現
  rarity:
    common:
      display-name: "&a普通"
      weight: 50
      value-multiplier: 1.0
      aura-skills-xp-multiplier: 1.0
    uncommon:
      display-name: "&e優良"
      weight: 25
      value-multiplier: 1.2
      aura-skills-xp-multiplier: 1.2
    rare:
      display-name: "&9稀有"
      weight: 15
      value-multiplier: 1.5
      aura-skills-xp-multiplier: 1.5
    epic:
      display-name: "&5史詩"
      weight: 8
      value-multiplier: 2.0
      aura-skills-xp-multiplier: 3.0
    legendary:
      display-name: "&6傳說"
      weight: 2
      value-multiplier: 3.0
      aura-skills-xp-multiplier: 5.0

  # 是否給予原版 Minecraft 經驗
  enable-vanilla-exp: true

  # 原版經驗倍率
  vanilla-exp-multiplier: 1.0

  # 必須為 false，才能使用 default-mode: vanilla
  # 設為 true 時，所有玩家都會被強制使用 KKFish 插件模式
  disable-vanilla-fishing: false

  # 釣竿耐久度消耗
  durability:
    max-single-loss: 5
    base-loss: 1

# ======================================================================
# 魚獲廣播
# ======================================================================

broadcast:
  enabled: true
  # global：全伺服器；world：目前世界；none：只有玩家本人
  range: "global"

# ======================================================================
# 特殊釣魚：岩漿／虛空
# ======================================================================

# 岩漿釣魚
lava-fishing:
  enabled: true
  # AUTO：自動允許
  # PERMISSION：需要 kkfish.fishing.lava 權限
  # EQUIPMENT：需要具有 lava-fishing 效果的裝備
  # BOTH：權限或裝備符合其中一項即可
  trigger-mode: AUTO
  bite-time-min: 100
  bite-time-max: 400
  bite-chance-multiplier: 0.8
  minigame:
    difficulty-multiplier: 1.2
  effects:
    ambient-particle: FLAME
    ambient-particle-count: 2
    bite-particle: FLAME
    bite-particle-count: 20
    bite-sound: ENTITY_GENERIC_EXTINGUISH_FIRE
    bite-sound-volume: 0.25
    bite-sound-pitch: 1.0

# 虛空釣魚
void-fishing:
  enabled: true
  trigger-mode: AUTO
  end-detection:
    # 是否在終界啟用虛空位置偵測
    enabled: true
    # 偵測倒數刻數；20 刻等於 1 秒
    countdown-ticks: 2
    # 魚鉤是否必須位於玩家下方
    require-below-player: true
  bite-time-min: 120
  bite-time-max: 500
  bite-chance-multiplier: 0.7
  minigame:
    difficulty-multiplier: 1.5
  effects:
    ambient-particle: END_ROD
    ambient-particle-count: 1
    bite-particle: END_ROD
    bite-particle-count: 20
    bite-sound: ITEM_TRIDENT_THUNDER
    bite-sound-volume: 0.25
    bite-sound-pitch: 1.0

# ======================================================================
# 小遊戲進度條樣式
# ======================================================================

styles:
  default:
    progress-char: "&9="
    progress-bar-empty-char: "&7-"
    green-bar-char: "&a|"
    green-bar-edge-char: "&2|"
    background-char: "&7|"
    fish-indicator-char: "&9|||"
  lava:
    progress-char: "&6="
    progress-bar-empty-char: "&8-"
    green-bar-char: "&c|"
    green-bar-edge-char: "&4|"
    background-char: "&8|"
    fish-indicator-char: "&e|||"
  void:
    progress-char: "&5═"
    progress-bar-empty-char: "&8─"
    green-bar-char: "&d|"
    green-bar-edge-char: "&5|"
    background-char: "&8|"
    fish-indicator-char: "&b|||"

# ======================================================================
# 經濟系統
# ======================================================================

economy:
  # 經濟相關功能總開關
  enabled: true
  # 是否啟用 Vault 經濟
  economy: true
  # 是否啟用 PlayerPoints
  playerpoints: true
  # fish.yml 的 value 預設使用 vault 或 playerpoints
  primary: vault
  # 主要經濟不可用時，是否嘗試另一個經濟系統
  fallback: true
  # 是否啟用出售功能
  sell: true
  # 是否啟用出售介面
  sellgui: true

# ======================================================================
# 季節系統
# ======================================================================

seasonal:
  enabled: true
  price-fluctuation:
    enabled: true
    # 相對基礎價格的季節浮動
    spring: 0.1
    summer: 0.2
    autumn: -0.1
    winter: -0.2
    # 基礎隨機價格浮動
    base: 0.05

# ======================================================================
# 資料庫
# ======================================================================

database:
  # 可用值：sqlite／mysql
  type: "sqlite"
  sqlite:
    file: "data.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "kkfish"
    username: "root"
    password: "password"
    table-prefix: "kkfish_"
    use-ssl: false
    timeout: 30000

# ======================================================================
# 物品說明範本
# ======================================================================

item-templates:
  fish-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🐟 魚類資訊 🐟 ━━━━━━━┓
        &b┃ 名稱：&f%name%
        &a┃ 尺寸：&f%size%&a cm
        &c┃ 價值：&f%value%&c 金幣
        &d┃ 稀有度：&f%rarity%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &d✨ 特殊效果：
        &7➤ %effects%
        &7
    simple:
      content: |-
        &b🐠 名稱：%name%
        &a📏 尺寸：%size% cm
        &c💰 價值：%value% 金幣
        &d💎 稀有度：%rarity%
        &d✨ 特殊效果：
        &7➤ %effects%

  rod-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🎣 釣竿屬性 🎣 ━━━━━━━┓
        &b┃ 難度係數：&f%difficulty%
        &a┃ 浮標區域：&f%float_area%
        &c┃ 耐久度：&f%durability%
        &d┃ 蓄力速度：&f%charge_speed%
        &5┃ 上鉤機率加成：&f%bite_rate_bonus%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &e✨ 特殊效果：
        &7➤ %effects%
        &7🎣 祝你釣魚愉快！
    compact:
      content: |-
        &b🎣 釣竿核心屬性：
        &b├─ 難度：%difficulty%｜浮標範圍：%float_area%
        &c├─ 耐久度：%durability%
        &d└─ 蓄力速度：%charge_speed%｜上鉤加成：%bite_rate_bonus%
        &e✨ 特殊效果：%effects%

  hook-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🪝 魚鉤資訊 🪝 ━━━━━━━┓
        &7┃ 等級：&f%level%
        %rarity_color%┃ 稀有度：&f%rarity_name%
        &7┃ 說明：&f%description%
        &6┠━━━━━━━ 📊 性能 📊 ━━━━━━━┨
        &7┃ %performance_metrics%
        &6┠━━━━━━━ 📋 狀態 📋 ━━━━━━━┨
        &7┃ %status_info%
        &6┠━━━━━━━ ⚙️ 裝備 ⚙️ ━━━━━━━┨
        &7┃ %equipment_info%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
    simple:
      content: |-
        &7🪝 %rarity_color%%rarity_name%&7｜等級：%level%
        &7📝 %description%
        &7📊 性能：%performance_metrics%
        &7📋 狀態：%status_info%
        &7⚙️ 裝備：%equipment_info%

  bait-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🦐 魚餌資訊 🦐 ━━━━━━━┓
        &b┃ 名稱：&f%name%
        &7┃ 說明：&f%description%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &d✨ 魚餌效果：
        &7➤ %effects%
        &7
    compact:
      content: |-
        &b🦐 名稱：%name%
        &7📝 說明：%description%
        &d✨ 效果：
        &7➤ %effects%
