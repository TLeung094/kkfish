# 設定版本：1.6.1
# 此設定包已統一為台灣繁體中文，並預設使用原版釣魚流程取得 KKFish 自訂魚類。

bstats:
  enabled: true
language:
  # 沿用插件支援的 zh_cn 代碼
  current: "zh_cn"
timezone:
  value: "Asia/Taipei"
update-check:
  enabled: true
debug:
  enabled: false
visual-effects:
  enabled: true
  fish-animation:
    enabled: true
    max-ticks: 40
    peak-height: 2.5
    max-speed: 0.5
    upward-force-factor: 0.25
    peak-progress: 0.25
    min-y-offset: 0.8
    jump-to-head:
      base-duration: 20
      distance-multiplier: 5.0
      max-duration: 60
      initial-jump-height: 2.0
      curve-height: 3.0
      easing-factor: 2.0

world-whitelist:
  enabled: true
  worlds:
    - "spawn"
    - "world"
    - "world_nether"
    - "world_the_end"

mode-switch:
  # plugin：KKFish 小遊戲；vanilla：Minecraft 原版釣魚流程
  default-mode: vanilla
  allow-command-switch: true
  vanilla-mode:
    # 原版成功釣到物品時改為給予 KKFish 自訂魚類
    give-custom-fish: true

fishing-settings:
  max-charge-time: 3000
  cast-cooldown: 5000
  base-bite-chance: 0.2
  max-bite-chance: 1.0
  bite-check-delay-min: 5000
  bite-check-delay-max: 15000
  bite-hint-timeout: 2
  escape: false
  initial-progress: 10
  progress-bar:
    increase-speed: 0.015
    decrease-speed: 0.01
    rarity-impact:
      enabled: true
      slowdown-per-rarity-level: 0.15
      min-increase-speed-ratio: 0.45
  rarity:
    common:
      display-name: "&a普通"
      weight: 50
      value-multiplier: 1.0
      aura-skills-xp-multiplier: 1.0
    uncommon:
      display-name: "&e優良"
      weight: 25
      value-multiplier: 1.2
      aura-skills-xp-multiplier: 1.2
    rare:
      display-name: "&9稀有"
      weight: 15
      value-multiplier: 1.5
      aura-skills-xp-multiplier: 1.5
    epic:
      display-name: "&5史詩"
      weight: 8
      value-multiplier: 2.0
      aura-skills-xp-multiplier: 3.0
    legendary:
      display-name: "&6傳說"
      weight: 2
      value-multiplier: 3.0
      aura-skills-xp-multiplier: 5.0
  enable-vanilla-exp: true
  vanilla-exp-multiplier: 1.0
  # 必須保持 false，預設原版模式才會生效
  disable-vanilla-fishing: false
  durability:
    max-single-loss: 5
    base-loss: 1

broadcast:
  enabled: true
  range: "global"

lava-fishing:
  enabled: true
  trigger-mode: AUTO
  bite-time-min: 100
  bite-time-max: 400
  bite-chance-multiplier: 0.8
  minigame:
    difficulty-multiplier: 1.2
  effects:
    ambient-particle: FLAME
    ambient-particle-count: 2
    bite-particle: FLAME
    bite-particle-count: 20
    bite-sound: ENTITY_GENERIC_EXTINGUISH_FIRE
    bite-sound-volume: 0.25
    bite-sound-pitch: 1.0

void-fishing:
  enabled: true
  trigger-mode: AUTO
  end-detection:
    enabled: true
    countdown-ticks: 2
    require-below-player: true
  bite-time-min: 120
  bite-time-max: 500
  bite-chance-multiplier: 0.7
  minigame:
    difficulty-multiplier: 1.5
  effects:
    ambient-particle: END_ROD
    ambient-particle-count: 1
    bite-particle: END_ROD
    bite-particle-count: 20
    bite-sound: ITEM_TRIDENT_THUNDER
    bite-sound-volume: 0.25
    bite-sound-pitch: 1.0

styles:
  default:
    progress-char: "&9="
    progress-bar-empty-char: "&7-"
    green-bar-char: "&a|"
    green-bar-edge-char: "&2|"
    background-char: "&7|"
    fish-indicator-char: "&9|||"
  lava:
    progress-char: "&6="
    progress-bar-empty-char: "&8-"
    green-bar-char: "&c|"
    green-bar-edge-char: "&4|"
    background-char: "&8|"
    fish-indicator-char: "&e|||"
  void:
    progress-char: "&5═"
    progress-bar-empty-char: "&8─"
    green-bar-char: "&d|"
    green-bar-edge-char: "&5|"
    background-char: "&8|"
    fish-indicator-char: "&b|||"

economy:
  enabled: true
  economy: true
  playerpoints: true
  primary: vault
  fallback: true
  sell: true
  sellgui: true

seasonal:
  enabled: true
  price-fluctuation:
    enabled: true
    spring: 0.1
    summer: 0.2
    autumn: -0.1
    winter: -0.2
    base: 0.05

database:
  type: "sqlite"
  sqlite:
    file: "data.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "kkfish"
    username: "root"
    password: "password"
    table-prefix: "kkfish_"
    use-ssl: false
    timeout: 30000

item-templates:
  fish-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🐟 魚類資訊 🐟 ━━━━━━━┓
        &b┃ 名稱：&f%name%
        &a┃ 尺寸：&f%size%&a cm
        &c┃ 價值：&f%value%&c 金幣
        &d┃ 稀有度：&f%rarity%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &d✨ 特殊效果：
        &7➤ %effects%
        &7
    simple:
      content: |-
        &b🐠 名稱：%name%
        &a📏 尺寸：%size% cm
        &c💰 價值：%value% 金幣
        &d💎 稀有度：%rarity%
        &d✨ 特殊效果：
        &7➤ %effects%
  rod-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🎣 釣竿屬性 🎣 ━━━━━━━┓
        &b┃ 難度係數：&f%difficulty%
        &a┃ 浮標區域：&f%float_area%
        &c┃ 耐久度：&f%durability%
        &d┃ 蓄力速度：&f%charge_speed%
        &5┃ 上鉤機率加成：&f%bite_rate_bonus%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &e✨ 特殊效果：
        &7➤ %effects%
        &7🎣 祝你釣魚愉快！
    compact:
      content: |-
        &b🎣 釣竿核心屬性：
        &b├─ 難度：%difficulty%｜浮標範圍：%float_area%
        &c├─ 耐久度：%durability%
        &d└─ 蓄力速度：%charge_speed%｜上鉤加成：%bite_rate_bonus%
        &e✨ 特殊效果：%effects%
  hook-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🪝 魚鉤資訊 🪝 ━━━━━━━┓
        &7┃ 等級：&f%level%
        %rarity_color%┃ 稀有度：&f%rarity_name%
        &7┃ 說明：&f%description%
        &6┠━━━━━━━ 📊 性能 📊 ━━━━━━━┨
        &7┃ %performance_metrics%
        &6┠━━━━━━━ 📋 狀態 📋 ━━━━━━━┨
        &7┃ %status_info%
        &6┠━━━━━━━ ⚙️ 裝備 ⚙️ ━━━━━━━┨
        &7┃ %equipment_info%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
    simple:
      content: |-
        &7🪝 %rarity_color%%rarity_name%&7｜等級：%level%
        &7📝 %description%
        &7📊 性能：%performance_metrics%
        &7📋 狀態：%status_info%
        &7⚙️ 裝備：%equipment_info%
  bait-templates:
    default:
      content: |-
        &6┏━━━━━━━ 🦐 魚餌資訊 🦐 ━━━━━━━┓
        &b┃ 名稱：&f%name%
        &7┃ 說明：&f%description%
        &6┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛
        &d✨ 魚餌效果：
        &7➤ %effects%
        &7
    compact:
      content: |-
        &b🦐 名稱：%name%
        &7📝 說明：%description%
        &d✨ 效果：
        &7➤ %effects%
